<div class="st-strip" data-strip>
  <div class="wrap">
    <div class="st-strip-pills" role="group" aria-label="Matches by league">
      <button type="button" class="st-strip-pill" data-strip-filter="all" aria-pressed="true">All Matches (0)</button>
    </div>
    <div class="st-strip-pills" role="group" aria-label="Match status">
      <button type="button" class="st-strip-pill" data-match-filter="all" aria-pressed="true">All</button>
      <button type="button" class="st-strip-pill" data-match-filter="live" aria-pressed="false">Live</button>
      <button type="button" class="st-strip-pill" data-match-filter="upcoming" aria-pressed="false">Upcoming</button>
      <button type="button" class="st-strip-pill" data-match-filter="result" aria-pressed="false">Result</button>
    </div>
    <div class="st-strip-view">
      <p data-strip-empty hidden>No matches in this view.</p>
      <div class="st-strip-track" data-strip-group="all"></div>
      <div class="st-strip-note" data-strip-group="apl" hidden>
        <p><b>APL 2026-27 &mdash; fixtures not published yet.</b> The Afghanistan Cricket Board has not released the fixture list. The APL starts on Sunday 27 December 2026 in the UAE &mdash; the full schedule will appear here as soon as it is announced.</p>
      </div>
      <button type="button" class="st-strip-arrow" data-strip-prev aria-label="Previous matches" style="display:none">&#8249;</button>
      <button type="button" class="st-strip-arrow" data-strip-next aria-label="More matches">&#8250;</button>
    </div>
  </div>
</div>
