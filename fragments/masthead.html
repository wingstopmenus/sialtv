<header class="st-masthead" style="border-bottom:1px solid rgba(227,223,240,.85);padding-bottom:0;margin-bottom:0">
  <div class="st-shell st-masthead__row">
    <a class="st-wordmark" href="/" aria-label="SialTV home" style="color:#0c1022;text-decoration:none">
          <span class="st-wordmark__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          </span>
          <span class="st-wordmark__text">Sial<em>TV</em></span>
        </a>
    <div class="st-menu" role="navigation" aria-label="Leagues">
      <a href="/npl/" style="color:#3b4258;text-decoration:none">NPL</a>
      <a href="/ilt20/" style="color:#3b4258;text-decoration:none">ILT20</a>
      <a href="/apl/" style="color:#3b4258;text-decoration:none">APL</a>
    </div>
    <div class="st-search" data-search>
      <button class="st-search__toggle" type="button" aria-expanded="false" aria-controls="st-search-box" aria-label="Search" data-search-toggle>
        <svg class="st-search__icon-search" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <svg class="st-search__icon-close" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="st-search__box" id="st-search-box" hidden>
        <svg class="st-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="st-search-input" class="st-search__input" type="search" data-search-input aria-label="Search players, teams and matches" placeholder="Search players, teams, matches&hellip;" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="st-search-results" aria-autocomplete="list">
        <ul id="st-search-results" class="st-search__results" data-search-results role="listbox" hidden></ul>
      </div>
    </div>
    <a class="st-action" href="/live-scores/">Live scores</a>
    <button class="st-burger" type="button" aria-expanded="false" aria-controls="st-drawer" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="st-drawer" id="st-drawer">
    <div class="st-shell">
      <nav aria-label="Leagues (mobile)" style="gap:0;margin:0">
        <a href="/npl/" style="color:#0c1022;text-decoration:none">Nepal Premier League</a>
        <a href="/ilt20/" style="color:#0c1022;text-decoration:none">ILT20</a>
        <a href="/apl/" style="color:#0c1022;text-decoration:none">Afghanistan Premier League</a>
        <a href="/series/" style="color:#0c1022;text-decoration:none">All series</a>
        <a href="/about/" style="color:#0c1022;text-decoration:none">About SialTV</a>
      </nav>
      <a class="st-action st-action--block" href="/live-scores/">Live scores</a>
    </div>
  </div>
</header>
